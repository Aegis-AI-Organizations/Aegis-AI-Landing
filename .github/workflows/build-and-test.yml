name: Module - Build & Test
on: workflow_call

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test CMS access and publishing
        run: npm run test:cms
      - name: Test production migrations and bootstrap protection
        run: NODE_ENV=production npm run test:cms
      - name: Test password recovery with Mailpit
        run: NODE_ENV=production npm run test:mailpit
      - name: Build (Next.js)
        run: npm run build
      - name: Run coverage
        run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-coverage
          path: coverage
          if-no-files-found: ignore
